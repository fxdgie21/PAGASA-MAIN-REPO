  <!-- 4. Arched Bold Text: PAG (Top Left) with 3D Navy Shadow -->
  <text fill="#1C2E4A" font-size="72" font-weight="900" font-family="'Arial Black', 'Impact', sans-serif" letter-spacing="9">
    <textPath href="#arc-pag" startOffset="50%" text-anchor="middle">PAG</textPath>
  </text>
  <text x="-4" y="-4" fill="#FFFFFF" stroke="#1C2E4A" stroke-width="3.5" stroke-linejoin="round" font-size="72" font-weight="900" font-family="'Arial Black', 'Impact', sans-serif" letter-spacing="9">
    <textPath href="#arc-pag" startOffset="50%" text-anchor="middle">PAG</textPath>
  </text>

  <!-- Arched Bold Text: ASA (Top Right) with 3D Navy Shadow -->
